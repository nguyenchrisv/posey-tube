[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "posey-tube"
version = "0.1.0"
description = "GPIO gateway: exposes configured Raspberry Pi pins as an HTTP API on the lab LAN"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
dependencies = [
  "aiohttp>=3.10,<4",
  "gpiozero>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["posey_tube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
